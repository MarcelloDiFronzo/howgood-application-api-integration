name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ENV: dev
      DEV_HOWGOOD_SECRET: dummy-secret
      DEV_HOWGOOD_ENDPOINT: https://example.com/apply

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Run unit tests
        run: python -m pytest -q -m "not integration"
