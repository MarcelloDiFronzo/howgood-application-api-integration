[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "howgood-apply"
version = "0.1.0"
dependencies = [
    "requests",
    "pydantic",
    "python-dotenv",
    "loguru",
]

[project.scripts]
howgood-apply = "howgood_apply.cli:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["howgood_apply*"]
